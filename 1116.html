<!DOCTYPE html>
<html>
<head>
    <title>計時器</title>
    <style>
        .digit{
            font-size: 80pt;
        }
    </style>
    <script>
        var timer_sec=0;/*全域變數*/
        var timer_id=-1;
        function timer_start(){
            timer_id=setInterval(function(){
                timer_sec++;
                if(timer_sec<10){
                    document.getElementById("timer").innerHTML="0"+timer_sec;
                }else{
                    document.getElementById("timer").innerHTML=timer_sec;
                }
        
            },1000)
            
        }
        function timer_stop(){
            if(timer_id<0) return;
            clearInterval(timer_id);
            timer_id=-1;
        }
        function timer_reset(){
            timer_stop();
            document.getElementById("timer").innerHTML="00";
            timer_sec=0;
        }

/*-------------------------------------------------------------------------------------------------------------------------------------------------*/
        function getRandom(min,max){
            return Math.floor(Math.random() * (max - min + 1))+min;
        }
        function getLottery(){
            setTimeout(clearInterval,3000,setInterval(()=>{
                var x=getRandom(0,99);
                document.getElementById("lottery").innerHTML=((x<10)?"0":"")+x;
            },100));
        }
/*---------------------------------------------------------------------------------------------*/
    function getDice(){
        setTimeout(clearInterval,3000,
            setInterval((img)=>{
                img.src=`dice${getRandom(1,6)}.png`;
            },150,event.target)
        );
    }        
    </script>
</head>
<body>
<div id="timer" class="digit">00</div>
<button onclick="timer_start()">start</button>
<button onclick="timer_stop()">stop</button>
<button onclick="timer_reset()">reset</button>
<hr>
<div id="lottery" class="digit">00</div>
<button onclick="getLottery()">樂透</button>
<hr>
<img src="dice0.png" width="100px" onclick="getDice(this)">
</body>
</html>
