<html>
<head>
<title>1005.html</title>
<style>
  #d1{
    /* 容器 BOX
        box-sizing: 寬高預設 content-box ->可改 border-box;

        由內到外 content(寬高)/padding(填充)/border(框線)/margin(邊界)



    */
    width: 100px;
    height:100px;
    background-color:lightblue; 
    border: 5px solid black;
    border-color: red yellow green blue;
    border-width:10px;
    
    padding: 10px 50px 30px;
    margin-bottom: 10px;
  }
   
  
  
  
  #d2{
        border:1px solid black;
        height: 200px;
        width: 400px;
        margin: 20px;
        border-radius:  20px;
   }


   #d3{
        border: 1px solid black;
        height: 50px;
        width: 50px;
        margin: 30px;



   }
   #d4{
        border: 100px solid transparent;
        height: 0px;
        width: 0px;
        
           
        border-bottom-color:rgb(0, 195, 255);
        border-top-width: 0px;
   }
   #d5{
     border: 100px solid transparent;
        height: 0px;
        width: 0px;
        
        
        border-bottom-color:rgb(0, 195, 255);
        border-bottom-width: 0px;


   }


</style>










</head>
<body>
<div id="d1">html</div>
<div id="d2"></div>
<div id="d3"></div>
<div id="d4"></div>
<div id="d5"></div>
<div id="d6"></div>



</body>



</html>
