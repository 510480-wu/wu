<!DOCTYPE html>
<head>
<title>1019.html</title>
<style>
    #d{
        border: 1px solid black;
        width: 600px;
        height: 600px;
        position: relative;
        top: 20px;
        left: 20px;
    }
    #d1{
        border: 2px solid red;
        width: 100px;
        height: 100px;
        background-color: hsla(0deg, 100%, 50%, 0.4);
        position: relative;
        z-index: 100;
        
    }
    #d2{
        border: 2px solid rgb(117, 196, 0);
        width: 100px;
        height: 100px;
        position: relative;
        top: 10px;
        left: 10px;
    }
    #d3{
        border: 2px solid rgb(98, 255, 203);
        width: 100px;
        height: 100px;
        background-color: hsla(120deg, 100%, 50%, 1);
        z-index: 90;
        position: absolute;
        top: 20px;
        left:20px;
    }
    #d4{
        background-color: hsla(60deg, 100%, 50%, 1);
        width: 100px;
        height: 100px;
       
    }
    #a{
        border: 2px dashed black;
        width: 100px;
        height: 100px;
        position: absolute;
        top: 510px;
        left: 0px;
    }
</style>
</head>
<body>
    <div id="d">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
    </div>
    <div id="a"></div>
</body>
</html>
